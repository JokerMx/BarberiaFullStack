services:
  # ===== POSTGRESQL =====
  postgres:
    image: postgres:16-alpine
    container_name: barberia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: barberia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barberia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== BACKEND (Spring Boot) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: barberia-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/barberia_db
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barberia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/auth/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ===== FRONTEND (Vite + Nginx) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: barberia-frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - barberia-network
    restart: unless-stopped

networks:
  barberia-network:
    driver: bridge

volumes:
  postgres_data: